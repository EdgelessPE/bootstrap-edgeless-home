# 宝塔站点完整配置：home.edgeless.top
server
{
    listen 80;
    listen 443 ssl http2;
    server_name home.edgeless.top;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/home.edgeless.top;
    include /www/server/panel/vhost/nginx/extension/home.edgeless.top/*.conf;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除并保持这段设置在优先级高的位置
    include /www/server/panel/vhost/nginx/well-known/home.edgeless.top.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate /www/server/panel/vhost/cert/home.edgeless.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/home.edgeless.top/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;
    #SSL-END

    # HTML 等资源每次访问时向服务器校验是否更新
    add_header Cache-Control "no-cache";

    #ERROR-PAGE-START 错误页配置，可以注释、删除或修改
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/html_home.edgeless.top.conf;
    #REWRITE-END

    # 禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # 一键申请SSL证书验证目录相关设置
    location ~ \.well-known
    {
        allow all;
    }

    # 禁止在证书验证目录放入敏感文件
    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    # Astro 构建生成的带哈希资源：缓存一年
    location ^~ /_astro/
    {
        try_files $uri =404;
        expires off;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000";

        access_log off;
    }

    # 固定文件名的图片和字体：缓存一天
    location ~* \.(webp|avif|gif|jpg|jpeg|png|bmp|svg|ico|woff|woff2|ttf|otf)$
    {
        try_files $uri =404;
        expires off;

        add_header Cache-Control "public, max-age=86400";
        add_header Strict-Transport-Security "max-age=31536000";

        access_log off;
    }

    # 其他固定文件名的 JS/CSS，例如教程页资源：缓存一天
    location ~* \.(js|mjs|css)$
    {
        try_files $uri =404;
        expires off;

        add_header Cache-Control "public, max-age=86400";
        add_header Strict-Transport-Security "max-age=31536000";

        access_log off;
    }

    access_log /www/wwwlogs/home.edgeless.top.log;
    error_log /www/wwwlogs/home.edgeless.top.error.log;
}
