# Include inside the nginx http {} block.
# Inside this site's server {}, add:
#   add_header Cache-Control $edgeless_cache_control;
# Remove competing expires / Cache-Control directives in this site's locations.
# Keep existing security headers in the same context as before.
map $uri $edgeless_cache_control {
  default "no-cache";
  ~^/_astro/ "public, max-age=31536000, immutable";
  ~*\.(?:webp|png|jpe?g|svg|ico|woff2?|ttf)$ "public, max-age=86400";
}
